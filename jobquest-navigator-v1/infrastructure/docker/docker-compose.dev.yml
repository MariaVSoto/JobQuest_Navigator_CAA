# Development override for docker-compose.yml
# Use with: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  # Development Database with exposed ports
  database:
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: jobquest_navigator_dev
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./init-dev-db.sql:/docker-entrypoint-initdb.d/init-dev-db.sql:ro

  # Development Backend with hot reload
  backend:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.backend.dev
    environment:
      - DATABASE_URL=postgresql://dev_user:dev_password@database:5432/jobquest_navigator_dev
      - DEBUG=1
      - DJANGO_SETTINGS_MODULE=core.settings_docker
      - PYTHONPATH=/app
      - WATCHMAN_BINARY_PATH=/usr/local/bin/watchman
    volumes:
      - ../../backend:/app:cached
      - /app/__pycache__
      - /app/**/__pycache__
      - static_dev_volume:/app/staticfiles
      - media_dev_volume:/app/media
    ports:
      - "8000:8000"
      - "8001:8001"  # Debug port
    command: >
      sh -c "
        python manage.py migrate &&
        python manage.py collectstatic --noinput &&
        python manage.py runserver 0.0.0.0:8000
      "
    stdin_open: true
    tty: true

  # Development Frontend with hot reload
  frontend:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.frontend.dev
      args:
        REACT_APP_API_URL: http://localhost:8000
        REACT_APP_ENVIRONMENT: development
    environment:
      - CHOKIDAR_USEPOLLING=true
      - GENERATE_SOURCEMAP=true
      - REACT_APP_API_URL=http://localhost:8000
      - REACT_APP_ENVIRONMENT=development
    volumes:
      - ../../frontend:/app:cached
      - /app/node_modules
      - /app/build
    ports:
      - "3002:3000"
    command: npm start
    stdin_open: true
    tty: true

  # Redis with persistent data for development
  redis:
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    command: redis-server --appendonly yes --save 60 1

  # Development tools container
  devtools:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.devtools
    container_name: jobquest-devtools
    volumes:
      - ../../:/workspace:cached
      - devtools_cache:/root/.cache
    working_dir: /workspace
    networks:
      - jobquest-network
    profiles:
      - devtools
    command: tail -f /dev/null

volumes:
  postgres_dev_data:
    driver: local
  redis_dev_data:
    driver: local
  static_dev_volume:
    driver: local
  media_dev_volume:
    driver: local
  devtools_cache:
    driver: local