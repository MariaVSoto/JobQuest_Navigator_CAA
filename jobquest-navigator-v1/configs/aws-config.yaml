# JobQuest Navigator AWS Deployment Configuration
# This file contains all AWS service configurations for production deployment

# Project Information
project:
  name: "JobQuest Navigator"
  version: "1.0.0"
  environment: "production"
  region: "us-east-1"
  
# AWS Account and Access
aws:
  account_id: "${AWS_ACCOUNT_ID}"
  region: "us-east-1"
  profile: "default"
  
# Lambda Configuration
lambda:
  function_name: "jobquest-navigator-api"
  runtime: "python3.9"
  timeout: 300
  memory_size: 512
  environment_variables:
    DJANGO_SETTINGS_MODULE: "core.settings_production"
    LAMBDA_DEPLOYMENT: "true"
  
# API Gateway Configuration
api_gateway:
  name: "jobquest-navigator-api"
  description: "JobQuest Navigator REST API Gateway"
  stage_name: "prod"
  cors_enabled: true
  
# RDS Database Configuration
rds:
  identifier: "jobquest-navigator-db"
  engine: "mysql"
  engine_version: "8.0"
  instance_class: "db.t3.micro"
  allocated_storage: 20
  storage_type: "gp2"
  database_name: "jobquest_navigator"
  master_username: "admin"
  backup_retention_period: 7
  multi_az: false
  publicly_accessible: false
  
# S3 Bucket Configuration
s3:
  static_bucket: "jobquest-navigator-static"
  frontend_bucket: "jobquest-navigator-frontend"
  lambda_bucket: "jobquest-navigator-lambda-deployments"
  
# VPC Configuration (Optional - using default VPC for simplicity)
vpc:
  use_default: true
  
# Security Groups
security_groups:
  lambda_sg:
    name: "jobquest-lambda-sg"
    description: "Security group for Lambda functions"
    ingress_rules: []
    egress_rules:
      - protocol: "tcp"
        port: 443
        cidr: "0.0.0.0/0"
      - protocol: "tcp"
        port: 3306
        cidr: "10.0.0.0/16"
  
  rds_sg:
    name: "jobquest-rds-sg"
    description: "Security group for RDS MySQL"
    ingress_rules:
      - protocol: "tcp"
        port: 3306
        source_security_group: "lambda_sg"
    egress_rules: []

# CloudWatch Configuration
cloudwatch:
  log_retention_days: 14
  enable_detailed_monitoring: false
  
# Cost Optimization Settings
cost_optimization:
  lambda_reserved_concurrency: null  # No reserved concurrency for cost savings
  rds_auto_minor_version_upgrade: true
  rds_deletion_protection: false  # For easy cleanup in staging
  s3_lifecycle_rules:
    - rule_name: "cleanup_old_logs"
      status: "Enabled"
      expiration_days: 30
      
# Monitoring and Alerting
monitoring:
  enable_cloudwatch_alarms: true
  alert_email: "${ALERT_EMAIL}"
  alarms:
    - name: "lambda_errors"
      metric: "Errors"
      threshold: 10
      period: 300
    - name: "rds_cpu_high"
      metric: "CPUUtilization"
      threshold: 80
      period: 300

# Tags (Applied to all resources)
tags:
  Project: "JobQuest Navigator"
  Environment: "Production"
  Owner: "${PROJECT_OWNER}"
  CostCenter: "Education"
  Purpose: "Graduation Project"