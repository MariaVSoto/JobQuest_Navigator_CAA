<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ company_name }}{% endblock %}</title>
    <style>
        /* Reset styles */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        /* Base styles */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #333333;
            background-color: #f8fafc;
        }
        
        .email-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .email-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 2rem;
            text-align: center;
        }
        
        .email-logo {
            font-size: 2rem;
            font-weight: bold;
            color: #ffffff;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .email-body {
            padding: 2rem;
        }
        
        .email-footer {
            background-color: #f1f5f9;
            padding: 1.5rem 2rem;
            text-align: center;
            font-size: 0.875rem;
            color: #64748b;
            border-top: 1px solid #e2e8f0;
        }
        
        h1, h2, h3 {
            color: #1e293b;
            margin-bottom: 1rem;
        }
        
        h1 { font-size: 1.75rem; }
        h2 { font-size: 1.5rem; }
        h3 { font-size: 1.25rem; }
        
        p {
            margin-bottom: 1rem;
            color: #475569;
        }
        
        .button {
            display: inline-block;
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            margin: 1rem 0;
            transition: transform 0.2s ease;
        }
        
        .button:hover {
            transform: translateY(-1px);
        }
        
        .button-secondary {
            background: #e2e8f0;
            color: #475569;
        }
        
        .alert {
            padding: 1rem;
            border-radius: 8px;
            margin: 1rem 0;
        }
        
        .alert-info {
            background-color: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #1e40af;
        }
        
        .alert-warning {
            background-color: #fef3c7;
            border: 1px solid #fcd34d;
            color: #92400e;
        }
        
        .alert-success {
            background-color: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #166534;
        }
        
        .social-links {
            margin: 1rem 0;
        }
        
        .social-links a {
            color: #64748b;
            text-decoration: none;
            margin: 0 0.5rem;
        }
        
        .divider {
            height: 1px;
            background-color: #e2e8f0;
            margin: 2rem 0;
        }
        
        /* Responsive */
        @media only screen and (max-width: 600px) {
            .email-container {
                margin: 0;
                box-shadow: none;
            }
            
            .email-header,
            .email-body,
            .email-footer {
                padding: 1.5rem 1rem;
            }
            
            .email-logo {
                font-size: 1.5rem;
            }
            
            h1 { font-size: 1.5rem; }
            h2 { font-size: 1.25rem; }
            h3 { font-size: 1.125rem; }
        }
    </style>
</head>
<body>
    <div class="email-container">
        <!-- Header -->
        <div class="email-header">
            <a href="{{ frontend_url }}" class="email-logo">
                🎯 {{ company_name }}
            </a>
        </div>
        
        <!-- Body -->
        <div class="email-body">
            {% block content %}{% endblock %}
        </div>
        
        <!-- Footer -->
        <div class="email-footer">
            <p>
                <strong>{{ company_name }}</strong><br>
                Your career journey starts here
            </p>
            
            <div class="social-links">
                <a href="{{ frontend_url }}">Website</a>
                <a href="{{ frontend_url }}/privacy">Privacy Policy</a>
                <a href="{{ frontend_url }}/terms">Terms of Service</a>
            </div>
            
            <p style="margin-top: 1rem; font-size: 0.75rem;">
                © {{ current_year }} {{ company_name }}. All rights reserved.<br>
                This email was sent to you because you have an account with us.
            </p>
        </div>
    </div>
</body>
</html>
