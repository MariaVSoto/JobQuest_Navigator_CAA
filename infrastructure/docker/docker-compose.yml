# Docker Compose configuration for JobQuest Navigator

services:
  # PostgreSQL Database
  database:
    image: postgres:15-alpine
    container_name: jobquest-database
    environment:
      POSTGRES_DB: jobquest_navigator
      POSTGRES_USER: jobquest_user
      POSTGRES_PASSWORD: jobquest_password
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_MULTIPLE_DATABASES: jobquest_navigator,jobquest_users
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "5432:5432"
    networks:
      - jobquest-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobquest_user -d jobquest_navigator"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: jobquest-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - jobquest-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Django Backend
  backend:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: jobquest-backend
    environment:
      - DATABASE_URL=postgresql://jobquest_user:jobquest_password@database:5432/jobquest_navigator
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=core.settings_docker
      - DEBUG=1
      - SECRET_KEY=django-insecure-local-development-key-change-in-production
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend,0.0.0.0
      - CORS_ALLOWED_ORIGINS=http://localhost:3002,http://localhost:3000,http://localhost:80
      - USE_MINIO=True
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - MINIO_BUCKET_NAME=jobquest-resumes
      - ADZUNA_APP_ID=3aea9429
      - ADZUNA_APP_KEY=47c6c2410fe3c75a1a1e7e90eb21fa95
      - GOOGLE_MAPS_API_KEY=AIzaSyBf2N3ZLGCX5NihlPvPsZlHkp13Z_t7cjw
    volumes:
      - ../../backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - jobquest-network
    restart: unless-stopped
    command: >
      sh -c "
        python manage.py migrate &&
        python manage.py runserver 0.0.0.0:8000
      "

  # FastAPI User Service
  user-service:
    build:
      context: ../../user-service
      dockerfile: Dockerfile
    container_name: jobquest-user-service
    environment:
      - DATABASE_URL=postgresql+asyncpg://jobquest_user:jobquest_password@database:5432/jobquest_users
      - SECRET_KEY=your-super-secret-key-change-in-production-12345
      - JWT_SECRET=your-jwt-secret-key-change-in-production-67890
      - JWT_ALGORITHM=HS256
      - JWT_LIFETIME_SECONDS=3600
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:3002","http://localhost:80","http://localhost"]
      - ENVIRONMENT=development
      - DEBUG=true
    ports:
      - "8002:8001"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - jobquest-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # React Frontend
  frontend:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.frontend
      args:
        REACT_APP_API_URL: /api
        REACT_APP_USER_SERVICE_URL: http://localhost:8002
        REACT_APP_ENVIRONMENT: development
        REACT_APP_DEV_AUTH_BYPASS: false
        REACT_APP_GOOGLE_MAPS_API_KEY: AIzaSyBf2N3ZLGCX5NihlPvPsZlHkp13Z_t7cjw
    container_name: jobquest-frontend
    ports:
      - "3002:80"  # Primary frontend access port
    depends_on:
      - backend
    networks:
      - jobquest-network
    restart: unless-stopped

  # Nginx Load Balancer (Optional)
  nginx:
    image: nginx:alpine
    container_name: jobquest-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/static:ro
      - media_volume:/media:ro
    depends_on:
      - backend
      - frontend
    networks:
      - jobquest-network
    restart: unless-stopped
    profiles:
      - proxy

  # Mailhog for Email Testing
  mailhog:
    image: mailhog/mailhog:latest
    container_name: jobquest-mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - jobquest-network
    restart: unless-stopped
    profiles:
      - email

  # MinIO for S3-compatible Object Storage
  minio:
    image: minio/minio:latest
    container_name: jobquest-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - jobquest-network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    profiles:
      - storage

  # LocalStack for AWS Services Emulation
  localstack:
    image: localstack/localstack:latest
    container_name: jobquest-localstack
    environment:
      - SERVICES=s3,lambda,apigateway,rds,cloudformation,logs,iam,sts
      - DEBUG=1
      - DATA_DIR=/var/lib/localstack
      - LAMBDA_EXECUTOR=docker
      - DOCKER_HOST=unix:///var/run/docker.sock
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - PERSISTENCE=1
      - LS_LOG=trace
    ports:
      - "4566:4566"            # LocalStack edge port
      - "4510-4559:4510-4559"  # External service port range
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - localstack_data:/var/lib/localstack
    networks:
      - jobquest-network
    restart: unless-stopped
    profiles:
      - localstack
      - aws-local

  # Elasticsearch for Search (Optional)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.8.0
    container_name: jobquest-elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - jobquest-network
    restart: unless-stopped
    profiles:
      - search

  # Monitoring with Prometheus (Optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: jobquest-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - jobquest-network
    restart: unless-stopped
    profiles:
      - monitoring

  # Grafana for Metrics Visualization (Optional)
  grafana:
    image: grafana/grafana:latest
    container_name: jobquest-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    ports:
      - "3003:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - jobquest-network
    restart: unless-stopped
    profiles:
      - monitoring

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local
  minio_data:
    driver: local
  localstack_data:
    driver: local
  elasticsearch_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  jobquest-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16